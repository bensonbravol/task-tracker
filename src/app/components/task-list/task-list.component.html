<app-task-form
  (taskCreated)="addTask($event)">
</app-task-form>

<div class="task-container">
  <h2>My Tasks</h2>

  <app-task-card
    *ngFor="let task of tasks"
    [task]="task"
    (completed)="markCompleted($event)"
    (reopened)="reopenTask($event)"
    (deleted)="deleteTask($event)"
  >
  </app-task-card>
</div>
