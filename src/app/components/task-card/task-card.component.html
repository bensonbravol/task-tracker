<div class="task-card">
  <div class="task-content">
    <div class="task-header">
      <h3>
        {{ task.title }}
      </h3>

      <span
        class="priority"
        [ngClass]="'priority-' + task.priority.toLowerCase()"
      >
        {{ task.priority }}
      </span>
    </div>

    <p class="description">
      {{ task.description }}
    </p>

    <p class="created-date">
      Created on:
      {{ task.createdAt | date: "medium" }}
    </p>

    <div class="status">
      <span *ngIf="task.completed" class="completed"> Completed </span>

      <span *ngIf="!task.completed" class="pending"> Pending </span>
    </div>
  </div>

  <div class="task-actions" *ngIf="showActions">
    <button
      *ngIf="!task.completed"
      class="btn btn-complete"
      (click)="markCompleted()"
    >
      Mark Completed
    </button>

    <button
      *ngIf="task.completed"
      class="btn btn-reopen"
      (click)="reopenTask()"
    >
      Reopen
    </button>

    <button class="btn btn-delete" (click)="deleteTask()">Delete</button>
  </div>
</div>
